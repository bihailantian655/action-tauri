name: Build Tauri App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clean Cargo cache
        run: |
          Remove-Item -Recurse -Force $env:CARGO_HOME\registry\cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:CARGO_HOME\registry\git -ErrorAction SilentlyContinue

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@1.5.6

      - name: Install dependencies
        run: npm install

      - name: Clean previous build
        run: |
          if (Test-Path "src-tauri/target") {
            Remove-Item -Recurse -Force "src-tauri/target"
          }

      - name: Build Tauri App
        run: npm run tauri build 

      - name: Upload exe artifact
        uses: actions/upload-artifact@v5
        with:
          name: FileExplorer-exe
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe