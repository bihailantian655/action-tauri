[package]
name = "file_explorer"
version = "1.0.0"
description = "A Tauri app with file explorer and weather display"
authors = ["you"]
edition = "2021"
resolver = "2"

[features]
custom-protocol = []

[[bin]]
name = "file_explorer"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
