[package]
name = "bat_r"
version = "1.0.0"
description = "BAT_R - Batch script manager"
authors = ["you"]
edition = "2021"
resolver = "2"

[features]
custom-protocol = []

[[bin]]
name = "bat_r"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "shell-execute", "fs-all", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
